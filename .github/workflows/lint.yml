# Revisa install.sh y custom-packages con shellcheck en cada push o pull request que los cambie.
# Usa npx, igual que en local, para que la versión de shellcheck sea la misma.
name: Lint

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - custom-packages/.local/bin/custom-packages
      - .github/workflows/lint.yml
  pull_request:
    paths:
      - install.sh
      - custom-packages/.local/bin/custom-packages
      - .github/workflows/lint.yml

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: npx -y shellcheck install.sh custom-packages/.local/bin/custom-packages
        env:
          # El paquete npm baja el binario de shellcheck consultando la API de GitHub. Sin token son 60 consultas por
          # hora compartidas entre los runners, y se agotan; con el del workflow el límite es propio del repo
          GITHUB_TOKEN: ${{ github.token }}
